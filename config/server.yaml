bgex-server:
  env: development
  port: "8080"
  jwt:
    # Secret must be set via JWT_SECRET env var (min 32 bytes).
    secret: ""
    access_ttl: 15m
    refresh_token_ttl: 720h
  google_oauth:
    # All three fields must be set (via env vars) to enable Google OAuth routes.
    client_id: ""
    client_secret: ""
    redirect_url: ""
  cors:
    allowed_origins:
      - http://localhost:3000
      - http://localhost:5173

postgres:
  url: postgres://bgex:bgex@localhost:5432/bgex?sslmode=disable

redis:
  url: redis://localhost:6379/0
