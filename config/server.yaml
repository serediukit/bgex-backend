server:
  env: development
  port: "8080"
  jwt:
    # Secret must be set via JWT_SECRET env var (min 32 bytes).
    secret: ""
    access_ttl: 15m
    refresh_token_ttl: 720h
  google_oauth:
    # All three fields must be set (via env vars) to enable Google OAuth routes.
    client_id: ""
    client_secret: ""
    redirect_url: ""
  cors:
    allowed_origins:
      - http://localhost:3000
      - http://localhost:5173

postgres:
  host: localhost
  port: 5432
  username: bgex
  password: bgex
  database: bgex
  applicationName: bgex-server

redis:
  cluster_host: localhost
  cluster_port: 6379
