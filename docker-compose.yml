services:
  postgres:
    image: postgres:16-alpine
    container_name: bgex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bgex
      POSTGRES_PASSWORD: bgex
      POSTGRES_DB: bgex
    ports:
      - "5432:5432"
    volumes:
      - bgex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgex -d bgex"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bgex-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - bgex_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bgex_pgdata:
  bgex_redisdata:
